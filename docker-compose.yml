services:
  web-reader:
    build: .
    container_name: web-reader
    restart: unless-stopped
    ports:
      - "3080:3080"
    volumes:
      - /mnt/gdrive/audiobooks:/mnt/gdrive/audiobooks:ro
      - ./frontend:/app/frontend
    environment:
      - AUDIOBOOKS_DIR=/mnt/gdrive/audiobooks
      - KOSYNC_URL=${KOSYNC_URL:-http://192.168.1.103:8085}
      - KOSYNC_USER=${KOSYNC_USER:-Gudian}
      - KOSYNC_KEY=${KOSYNC_KEY:-}
      - PORT=3080
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3080/api/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
