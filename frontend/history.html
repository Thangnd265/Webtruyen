<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch Sử Nghe & Đọc - Audio Web</title>
  <meta name="description" content="Danh sách lịch sử nghe và đọc truyện của bạn trên Audio Web, sắp xếp mới nhất ở trên cùng">
  <link rel="stylesheet" href="/css/tieuthuyetmang.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="/plugins/themes/theme-engine.js"></script>

  <style>
    body {
      background-color: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      font-family: var(--font-sans, 'Nunito', system-ui, sans-serif) !important;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .history-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: all 0.2s ease;
      position: relative;
    }

    .history-card:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transform: translateY(-2px);
    }

    .history-thumb {
      width: 80px;
      height: 110px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background-color: #171717;
      border: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .history-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding: 14px;
      }
      .history-card-top {
        display: flex;
        gap: 14px;
        width: 100%;
      }
      .history-thumb {
        width: 70px;
        height: 98px;
      }
      .history-actions {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-50 w-full border-b backdrop-blur" style="border-color:var(--border);background-color:var(--bg-surface)">
    <div class="container mx-auto flex h-16 items-center justify-between px-4 max-w-5xl">
      <div class="flex items-center gap-4">
        <a class="flex items-center gap-2 font-bold text-xl" href="/" style="color:var(--accent);text-decoration:none">
          🎧 Audio Web
        </a>
        <a href="/" class="hidden sm:inline-flex items-center gap-1 text-xs font-semibold px-3 py-1 rounded-full border hover:bg-neutral-500/10 transition" style="border-color:var(--border);color:var(--text-secondary);text-decoration:none">
          ← Về Trang chủ
        </a>
      </div>

      <div class="flex items-center gap-2">
        <div id="navbar-auth-container"></div>
        <button id="theme-toggle-btn" aria-label="Chuyển đổi giao diện" class="p-2 rounded-full transition-colors hover:opacity-80" title="Chuyển chế độ giao diện" type="button">
          <svg id="theme-toggle-icon" class="lucide lucide-moon w-5 h-5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="color:var(--text-secondary)" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 container mx-auto px-4 py-8 max-w-4xl">
    <!-- Breadcrumb & Title Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-4 border-b" style="border-color:var(--border)">
      <div>
        <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--accent)">
          <span>Tài Khoản & Cá Nhân Hóa</span>
          <span>•</span>
          <span id="history-sync-status">Đang tải...</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold flex items-center gap-2.5" style="color:var(--text-primary)">
          <span>📚 Lịch Sử Nghe & Đọc</span>
        </h1>
        <p class="text-xs sm:text-sm mt-1" style="color:var(--text-secondary)">
          Danh sách toàn bộ các bộ truyện bạn đã nghe, sắp xếp mới nhất ở trên cùng
        </p>
      </div>

      <div class="flex items-center gap-2.5">
        <button id="clear-all-history-btn" class="px-3.5 py-1.5 rounded-full text-xs font-semibold border border-red-500/40 text-red-500 hover:bg-red-500/10 transition inline-flex items-center gap-1.5" type="button" title="Xóa toàn bộ lịch sử">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          <span>Xóa tất cả</span>
        </button>
      </div>
    </div>

    <!-- History List Container -->
    <div id="history-items-list" class="flex flex-col gap-4">
      <div class="py-12 text-center" style="color:var(--text-secondary)">
        <p class="text-base font-semibold">Đang tải danh sách lịch sử...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t py-4 text-xs" style="border-color:var(--border);background-color:var(--bg-surface);color:var(--text-secondary)">
    <div class="container mx-auto px-4 text-center max-w-4xl">
      <p>© 2026 Audio Web • Tiến độ nghe được đồng bộ thời gian thực chuẩn Audio Web</p>
    </div>
  </footer>

  <!-- Auth Modal -->
  <div id="auth-modal" class="auth-modal-wrapper" role="dialog" aria-modal="true">
    <div id="auth-modal-overlay" class="auth-modal-overlay"></div>
    <div class="auth-modal-card">
      <div class="auth-modal-header">
        <h3 class="auth-modal-title">Tài khoản AudioWeb</h3>
        <button id="auth-modal-close" class="auth-close-btn" type="button" aria-label="Đóng">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="auth-tabs">
        <button id="auth-tab-login" class="auth-tab-btn active" type="button">Đăng nhập</button>
        <button id="auth-tab-register" class="auth-tab-btn" type="button">Đăng ký</button>
      </div>
      <div id="auth-error-msg" class="auth-error"></div>
      <form id="auth-form-login" class="auth-form active">
        <div class="auth-input-group">
          <label for="auth-login-username">Tên đăng nhập</label>
          <input id="auth-login-username" class="auth-input" type="text" placeholder="Nhập tên đăng nhập" required autocomplete="username">
        </div>
        <div class="auth-input-group">
          <label for="auth-login-password">Mật khẩu</label>
          <input id="auth-login-password" class="auth-input" type="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-submit-btn">Đăng nhập</button>
      </form>
      <form id="auth-form-register" class="auth-form">
        <div class="auth-input-group">
          <label for="auth-reg-username">Tên đăng nhập (chữ cái, số, _)</label>
          <input id="auth-reg-username" class="auth-input" type="text" placeholder="user123" required autocomplete="username">
        </div>
        <div class="auth-input-group">
          <label for="auth-reg-displayname">Tên hiển thị</label>
          <input id="auth-reg-displayname" class="auth-input" type="text" placeholder="Người Đọc Sách" required>
        </div>
        <div class="auth-input-group">
          <label for="auth-reg-password">Mật khẩu (tối thiểu 6 ký tự)</label>
          <input id="auth-reg-password" class="auth-input" type="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="auth-submit-btn">Đăng ký tài khoản</button>
      </form>
    </div>
  </div>

  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/history-page.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.themeEngine) window.themeEngine.init();
    });
  </script>
</body>
</html>
